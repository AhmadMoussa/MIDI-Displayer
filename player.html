<!DOCTYPE html>
<html>

<head>
    <script
        src="https://cdn.jsdelivr.net/combine/npm/tone@14.7.58,npm/@magenta/music@1.23.1/es6/core.js,npm/focus-visible@5,npm/html-midi-player@1.4.0"></script>

</head>

<body>

    <div id="player-div"></div>


    <script>
        const params = new URLSearchParams(window.location.search);
        const file = params.get("file");

        if (!file) {
            document.body.innerHTML = "<p>No file provided.</p>";
        } else {
            document.getElementById("player-div").innerHTML = `
            <midi-player
                src="midis/${file}"
                sound-font visualizer="#myVisualizer">
            </midi-player>
            <midi-visualizer type="piano-roll" id="myVisualizer"></midi-visualizer>
            `;
        }
    </script>
</body>

</html>
